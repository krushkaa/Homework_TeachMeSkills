<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student List</title>
</head>
<body>
<h1>Student List</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}">1</td>
        <td th:text="${student.name}">John Doe</td>
        <td th:text="${student.email}">john.doe@example.com</td>
        <td>
            <a th:href="@{/confirm-delete-student/{id}(id=${student.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
<a href="/add-student">Add New Student</a>
</body>
</html>
